// ---- GPS: use the live watch (best accuracy), upload the exact fix over HTTPS; the server encrypts it and only ever reveals a rounded distance
function startWatch(){if(WID!=null||!navigator.geolocation)return;try{WID=navigator.geolocation.watchPosition(p=>{FIX={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||999,t:Date.now()};S.loc=FIX},e=>{if(e.code==1){stopWatch();toast('Location permission denied')}},{enableHighAccuracy:true,maximumAge:0,timeout:30000})}catch(e){}}
function stopWatch(){if(WID!=null){try{navigator.geolocation.clearWatch(WID)}catch(e){}}WID=null;FIX=null}
function bestFix(ms=9000){return new Promise((res,rej)=>{if(!navigator.geolocation){toast('GPS not available');return rej(new Error('nogps'))}startWatch();const t0=Date.now();let best=null;(function w(){if(FIX&&FIX.t>=t0-15000&&(!best||FIX.acc<best.acc))best=FIX;if(best&&best.acc<=25||Date.now()-t0>ms){return best?res(best):rej(new Error('nofix'))}setTimeout(w,250)})()})}
async function pushLoc(cb,quiet){let ok=0;try{const f=await bestFix(),acc=Math.round(f.acc);await API('loc',{lat:+f.lat.toFixed(5),lng:+f.lng.toFixed(5),acc});if(D.p[UID]){D.p[UID].hasLoc=1;D.p[UID].seen=Date.now();D.p[UID].acc=acc}if(acc>100&&!quiet)toast('Weak GPS (±'+acc+' m), so distances may be off. Try outdoors or near a window.');ok=1;cb&&cb()}catch(e){if(e.message=='nofix')toast('Couldn’t get a GPS fix. Try outdoors or near a window.');else if(e.status)toast(e.message)}if(!me().ready)stopWatch();if(!ok)R()}
function shareLoc(){pushLoc(()=>{toast('Location updated');R()})}
async function autoLoc(){try{const p=await navigator.permissions.query({name:'geolocation'});if(p.state=='granted'&&(!me().hasLoc||Date.now()-(me().seen||0)>9e4))pushLoc(()=>R(),1)}catch(e){}}
function toggleReady(){if(me().ready){if(D.p[UID])D.p[UID].ready=0;R();return setP({ready:0})}pushLoc(()=>{if(D.p[UID]){D.p[UID].ready=1;D.p[UID].on=1}setP({ready:1,on:1});startWatch();armTrap();R();chillAsk()})}
function setOn(v){if(D.p[UID]){D.p[UID].on=v?1:0;if(!v){D.p[UID].ready=0;D.p[UID].online=0}else D.p[UID].online=1}if(!v)stopWatch();setP(v?{on:1}:{on:0,ready:0});if(v)beat();R()}
